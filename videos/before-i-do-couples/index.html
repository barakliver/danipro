<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .footage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 0;
      }
      .scene { z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- footage:begin -->
      <video id="footage-1" class="clip footage" src="assets/clips/f1-table.mp4" muted playsinline data-start="0.0" data-duration="4.5" data-track-index="3"></video>
      <video id="footage-2" class="clip footage" src="assets/clips/f3-open-box.mp4" muted playsinline data-start="10.0" data-duration="5.0" data-track-index="4"></video>
      <video id="footage-3" class="clip footage" src="assets/clips/f4a-pull-card.mp4" muted playsinline data-start="15.0" data-duration="1.95" data-track-index="3"></video>
      <video id="footage-4" class="clip footage" src="assets/clips/f4b-hand-card.mp4" muted playsinline data-start="16.95" data-duration="3.55" data-track-index="4"></video>
      <!-- footage:end -->
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-pain"
        class="scene"
        data-composition-id="02-pain"
        data-composition-src="compositions/frames/02-pain.html"
        data-start="4.5"
        data-duration="6.1"
        data-track-index="1"
      ></div>

      <div
        id="el-03-product"
        class="scene"
        data-composition-id="03-product"
        data-composition-src="compositions/frames/03-product.html"
        data-start="10"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-play"
        class="scene"
        data-composition-id="04-play"
        data-composition-src="compositions/frames/04-play.html"
        data-start="15"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="20.5"
        data-duration="4"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.5);
        tl.fromTo("#el-02-pain", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.5);
        tl.to("#el-02-pain", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-product", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 10);
        tl.to("#el-03-product", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-04-play", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to("#el-04-play", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.to({}, { duration: 24.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
