  /* 03-product — "Before I Do" names the product over the real open-box footage.
     Footage is mounted by the orchestrator full-bleed UNDER this frame; this frame is a
     transparent overlay: deep-ink top shade, a #F1F4F9 yield mat, wordmark, subline, stat card. */
  #root {
    position: absolute;
    inset: 0;

  /* ---- yield mat: transparent rounded window, solid #F1F4F9 surround ---- */
  .\30 3-product-matlayer {
    position: absolute;
    inset: 0;

    pointer-events: none;

  /* Full-frame window; the yield shrinks it with a transform scale (never top/left),
     so the inset reads 32px on every side once it lands. */
  .\30 3-product-hole {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;

  <div id="f03-product-ui" class="clip 03-product-ui" data-start="0" data-duration="5" data-track-index="1">
    <div class="03-product-head">
      <div class="03-product-wmrow" dir="ltr" lang="en">
        <span class="03-product-wm" id="f03-product-wm">Before I Do</span>
        <svg class="03-product-heart" id="f03-product-heart" viewBox="0 0 24 22" aria-hidden="true">
          <path
            d="M12 21.6 10.3 20C4.2 14.5.2 10.9.2 6.5.2 2.9 3 .1 6.6.1c2 0 4 .9 5.4 2.4C13.4 1 15.4.1 17.4.1 21 .1 23.8 2.9 23.8 6.5c0 4.4-4 8-10.1 13.5L12 21.6Z"
            fill="#EF453D"
          />
        </svg>
      </div>
      <div class="03-product-sub" id="f03-product-sub" dir="rtl" lang="he">
        <span class="03-product-word">משחק</span>
        <span class="03-product-word">קלפים</span>
        <span class="03-product-word">לזוגות</span>
        <span class="03-product-word">מאורסים</span>
      </div>
    </div>

    <div class="03-product-card" id="f03-product-card" dir="rtl" lang="he">
      <span class="03-product-num" id="f03-product-num">0</span>
      <div class="03-product-label" id="f03-product-label">
        <span class="03-product-line">שאלות שחובה לשאול</span>
        <span class="03-product-line">לפני החתונה</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    // Every timing lives here — re-time to the recorded VO by editing numbers only.
    const CUES = {
      beforeIDo: 0.05, // "Before I Do" — wordmark writes on, heart pops after "Do"
      mischakKlafim: 1.0, // "משחק קלפים" — subline per word
      shivim: 2.7, // "שבעים" — YIELD: footage recedes into a card, "70" card rises + counts
      shechovaLishol: 3.6, // "שחובה לשאול" — label lines reveal
      end: 5.0,
    };

    const $ = (id) => document.getElementById(id);
    const hole = $("f03-product-hole");
    const rim = $("f03-product-rim");
    const wm = $("f03-product-wm");
    const heart = $("f03-product-heart");
    const sub = $("f03-product-sub");
    const words = Array.prototype.slice.call(sub.getElementsByClassName("03-product-word"));
    const card = $("f03-product-card");
    const num = $("f03-product-num");
    const lines = Array.prototype.slice.call(
      $("f03-product-label").getElementsByClassName("03-product-line"),
    );

    const tl = gsap.timeline({ paused: true });

    // Scene 1 — wordmark writes itself on L→R (soft-edged mask wipe), heart pops after "Do".
    tl.fromTo(
      wm,
      { "--w03": 0 },
      { "--w03": 118, duration: 0.82, ease: "power1.out" },
      CUES.beforeIDo,
    );
    tl.fromTo(wm, { y: 14 }, { y: 0, duration: 0.9, ease: "power3.out" }, CUES.beforeIDo);
    tl.fromTo(
      heart,
      { scale: 0, rotation: -16, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(2.6)" },
      CUES.beforeIDo + 0.62,
    );

    // Scene 2 — subline reveals word by word (reading order, right→left).
    tl.fromTo(
      words,
      { opacity: 0, y: 34, filter: "blur(8px)" },
      {
        opacity: 1,
        y: 0,
        filter: "blur(0px)",
        duration: 0.6,
        ease: "power3.out",
        stagger: 0.16,
      },
      CUES.mischakKlafim,
    );

    // Scene 3 — YIELD: the footage recedes into a rounded card (mat closes in) in one event
    // with the white stat card rising into the space it hands over.
    // Window inset 0 → 32px on every side via transform scale; the radius is authored in the
    // window's local (pre-scale) space so it lands as a round 28px on screen.
    const INSET = 32;
    const RADIUS = 28;
    const SX = (1080 - 2 * INSET) / 1080;
    const SY = (1920 - 2 * INSET) / 1920;
    const rx = (RADIUS / SX).toFixed(2);
    const ry = (RADIUS / SY).toFixed(2);
    tl.fromTo(
      hole,
      { scaleX: 1, scaleY: 1, borderRadius: "0px / 0px" },
      {
        scaleX: SX,
        scaleY: SY,
        borderRadius: rx + "px / " + ry + "px",
        duration: 1.0,
        ease: "expo.out",
      },
      CUES.shivim,
    );
    tl.fromTo(rim, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, CUES.shivim + 0.15);
    tl.fromTo(card, { y: 90 }, { y: 0, duration: 0.85, ease: "power3.out" }, CUES.shivim + 0.05);
    tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, CUES.shivim + 0.05);

    // "70" counts up 0→70 while its scale grows to final size (counting-dynamic-scale).
    const COUNT_DUR = 1.25;
    const COUNT_EASE = "power3.out";
    const count = { v: 0 };
    tl.fromTo(
      count,
      { v: 0 },
      {
        v: 70,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () {
          num.textContent = String(Math.round(count.v));
        },
      },
      CUES.shivim + 0.1,
    );
    tl.fromTo(num, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, CUES.shivim + 0.1);

    // Scene 4 — label reveals line by line beside the number, then holds.
    tl.fromTo(
      lines,
      { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.32 },
      CUES.shechovaLishol,
    );

    window.__timelines["03-product"] = tl;
  })();
</script>
</template>
