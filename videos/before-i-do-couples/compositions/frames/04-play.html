            <span id="f04-play-dilemma-text"><span id="f04-play-opt-a">דיג'יי</span> <span class="f04-play-or">או</span> <span id="f04-play-opt-b">להקה חיה</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Every timing lives here: re-time to the recorded VO by editing numbers only.
      const CUES = {
        bottle: 0.05,       // "פותחים בקבוק": pill 01 slides in from the right
        card: 1.0,          // "שולפים קלף": pill 02 slides in below
        talk: 1.9,          // "ומדברים": pill 03 pops in, still moving across the cut
        cut: 1.95,          // footage hard cut f4a-pull-card -> f4b-hand-card (cut-the-curve seam)
        matters: 2.7,       // "על מה חשוב לכם": dilemma slot appears with card 1
        dilemma2: 3.5,      // card 2 (hard cut in place)
        noCompromise: 3.9,  // "לא מוותרים": reference only (card 2 is showing)
        dilemma3: 4.3,      // card 3 (hard cut in place), holds to the end
        end: 5.5,
      };

      const step1 = document.getElementById("f04-play-step1");
      const step2 = document.getElementById("f04-play-step2");
      const step3Slot = document.getElementById("f04-play-step3-slot");
      const step3 = document.getElementById("f04-play-step3");
      const carry = document.getElementById("f04-play-carry");
      const flash = document.getElementById("f04-play-flash");
      const dilemma = document.getElementById("f04-play-dilemma");
      const dilemmaCard = document.getElementById("f04-play-dilemma-card");
      const optA = document.getElementById("f04-play-opt-a");
      const optB = document.getElementById("f04-play-opt-b");

      const tl = gsap.timeline({ paused: true });

      // Scenes 1 + 2: step pills slide in from the right edge (partial travel), expo settle.
      // Opacity rides the same expo.out curve, so it is ~90% in after the first 0.25s.
      tl.fromTo(step1, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, CUES.bottle);
      tl.fromTo(step2, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, CUES.card);

      // Scene 3: cut-the-curve seam. The whole step column drifts left on one power3.inOut
      // curve (mirrored power3.in / power3.out halves) whose peak velocity lands exactly on
      // the footage cut, so the pills on screen keep their direction and speed across it.
      const CARRY = 20;   // px either side of the sketch anchor
      const HALF = 0.26;  // s per half
      tl.fromTo(carry, { x: CARRY }, { x: -CARRY, duration: HALF * 2, ease: "power3.inOut" }, CUES.cut - HALF);

      // Pill 03 enters already moving on the same leftward path (power4.out back half),
      // crossing the cut mid-flight, and pops (scale on the inner pill).
      tl.fromTo(step3Slot, { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, CUES.talk);
      tl.fromTo(step3, { scale: 0.82, transformOrigin: "100% 50%" },
        { scale: 1, transformOrigin: "100% 50%", duration: 0.5, ease: "back.out(2.2)" }, CUES.talk);

      // White light sweep, right to left, 0.12s centred on the cut. Off-canvas before and after.
      const SWEEP = 0.12;
      const FLASH_FROM = 1160;   // fully right of the canvas (skew included)
      const FLASH_TO = -1080;    // fully left of the canvas (skew included)
      gsap.set(flash, { x: FLASH_FROM, skewX: -14 });
      tl.fromTo(flash, { x: FLASH_FROM }, { x: FLASH_TO, duration: SWEEP, ease: "none", immediateRender: false }, CUES.cut - SWEEP / 2);

      // Scene 4: the dilemma slot slides in on the same leftward path, then its text cycles in place.
      tl.fromTo(dilemma, { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, CUES.matters);

      // discrete-text-sequence: sparse states, reverse search on every update, instant swaps.
      // Each swap also "stamps" the card (scale 1.06 -> 1, derived from time, so seek-safe).
      const SEQUENCE = [
        { t: CUES.matters, a: "דיג'יי", b: "להקה חיה" },
        { t: CUES.dilemma2, a: "הגשה לשולחן", b: "בופה" },
        { t: CUES.dilemma3, a: "להביא את הכלב", b: "להשאיר אותו בבית" },
      ];
      const PUNCH = 0.06;
      const PUNCH_DUR = 0.4;
      let shown = 0;
      optA.textContent = SEQUENCE[0].a;
      optB.textContent = SEQUENCE[0].b;
      gsap.set(dilemmaCard, { transformOrigin: "100% 50%", scale: 1 });

      function stateAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return i;
        }
        return 0;
      }

      const driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: CUES.end,
        duration: CUES.end,
        ease: "none",
        onUpdate: () => {
          const time = driver.t;
          const i = stateAt(time);
          if (i !== shown) {
            optA.textContent = SEQUENCE[i].a;
            optB.textContent = SEQUENCE[i].b;
            shown = i;
          }
          let s = 1;
          if (i > 0) {
            const p = (time - SEQUENCE[i].t) / PUNCH_DUR;
            if (p >= 0 && p < 1) s = 1 + PUNCH * Math.pow(1 - p, 3);
          }
          gsap.set(dilemmaCard, { scale: s });
        },
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-play"] = tl;
    })();
  </script>
</template>
