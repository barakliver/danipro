        <div class="02-pain-q" style="top: 360.8px; right: 156.6px">
          <div id="02-pain-j2" class="02-pain-jit"><div id="02-pain-q2" data-layout-allow-overlap class="02-pain-pill" dir="rtl" lang="he">מי מהעבודה?</div></div>
          <div class="02-pain-slot 02-pain-slot-l"><div id="02-pain-j2l" class="02-pain-jit"><div id="02-pain-a2l" data-layout-allow-overlap class="02-pain-chip 02-pain-chip-blue" dir="rtl" lang="he">כולם</div></div></div>
          <div class="02-pain-slot 02-pain-slot-r"><div id="02-pain-j2r" class="02-pain-jit"><div id="02-pain-a2r" data-layout-allow-overlap class="02-pain-chip 02-pain-chip-red" dir="rtl" lang="he">אף אחד</div></div></div>
        </div>
        <div class="02-pain-q" style="top: 527.2px; right: 91.8px">
          <div id="02-pain-j3" class="02-pain-jit"><div id="02-pain-q3" data-layout-allow-overlap class="02-pain-pill" dir="rtl" lang="he">איפה ההורים נכנסים?</div></div>
        </div>
      </div>

      <!-- The bold line: revealed word by word on the voice-over. -->
      <div id="02-pain-head" class="02-pain-head" dir="rtl" lang="he">
        <div class="02-pain-line"><span id="02-pain-w1" class="02-pain-word">ופתאום,</span></div>
        <div class="02-pain-line"><span id="02-pain-w2" class="02-pain-word">כל</span> <span id="02-pain-w3" class="02-pain-word">החלטה</span> <span id="02-pain-w4" class="02-pain-word">היא</span></div>
        <div class="02-pain-line"><span class="02-pain-ulwrap"><span id="02-pain-ulbar" class="02-pain-ulbar"></span><span id="02-pain-w5" class="02-pain-word">משא</span> <span id="02-pain-w6" class="02-pain-word">ומתן.</span></span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Every timing lives here — re-time the frame to the recorded VO by editing numbers only.
      const CUES = {
        q1: 0.05, // "כמה אורחים"
        a1: 0.55, // answers 150 / 300
        q2: 1.0, // "מי מהעבודה"
        a2: 1.45, // answers כולם / אף אחד
        q3: 1.9, // "איפה ההורים"
        jitter: 2.25, // nervous jitter starts (grows until ufitom)
        ufitom: 3.3, // "ופתאום" — cluster jolts askew + dims
        kolHachlata: 3.9, // "כל החלטה"
        masaUmatan: 4.6, // "משא ומתן"
        underline: 4.75, // red underline draws right→left
        end: 5.5,
      };

      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Macro move underneath everything: a slow, gentle push.
      tl.fromTo($("02-pain-stage"), { scale: 1 }, { scale: 1.02, duration: CUES.end, ease: "sine.inOut" }, 0);

      // Scenes 1–3 — question pills accumulate (spring-pop-entrance: scale 0→1, smooth power3 settle, no overshoot).
      const POP_DUR = 0.5;
      const POP_RISE = 24;
      [
        ["02-pain-q1", CUES.q1],
        ["02-pain-q2", CUES.q2],
        ["02-pain-q3", CUES.q3],
      ].forEach(([id, at]) => {
        tl.fromTo(
          $(id),
          { scale: 0, opacity: 0, y: POP_RISE },
          { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
          at,
        );
      });

      // "Their words" — two partners answer at once: chips slide in from opposite sides and settle askew.
      const CHIP_TRAVEL = 110;
      const CHIP_TILT = 5;
      const PARTNER_LAG = 0.06;
      const chip = (id, side, at, dur) =>
        tl.fromTo(
          $(id),
          { x: side * CHIP_TRAVEL, opacity: 0, rotation: 0, scale: 0.9 },
          { x: 0, opacity: 1, rotation: -side * CHIP_TILT, scale: 1, duration: dur, ease: "power3.out" },
          at,
        );
      chip("02-pain-a1l", -1, CUES.a1, 0.45);
      chip("02-pain-a1r", 1, CUES.a1 + PARTNER_LAG, 0.45);
      chip("02-pain-a2l", -1, CUES.a2, 0.36); // a touch faster
      chip("02-pain-a2r", 1, CUES.a2 + PARTNER_LAG * 0.7, 0.36);

      // Scene 3 — finite nervous jitter that grows. Deterministic (seeded PRNG), settles to 0 by "ופתאום".
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const JIT_IDS = ["02-pain-j1", "02-pain-j1l", "02-pain-j1r", "02-pain-j2", "02-pain-j2l", "02-pain-j2r", "02-pain-j3"];
      const JIT_STEP = 0.06;
      const JIT_AMP_START = 0.6;
      const JIT_AMP_END = 6;
      const jitSteps = Math.floor((CUES.ufitom - CUES.jitter) / JIT_STEP) - 1;
      const jitSettleAt = CUES.jitter + jitSteps * JIT_STEP;
      JIT_IDS.forEach((id, i) => {
        const rnd = mulberry32(0x2f6b + i * 977);
        const el = $(id);
        for (let k = 0; k < jitSteps; k++) {
          const p = jitSteps > 1 ? k / (jitSteps - 1) : 1;
          const amp = JIT_AMP_START + (JIT_AMP_END - JIT_AMP_START) * p * p;
          const dir = (k + i) % 2 === 0 ? 1 : -1;
          tl.to(
            el,
            {
              x: dir * amp * (0.55 + 0.45 * rnd()),
              y: (rnd() * 2 - 1) * amp * 0.5,
              rotation: -dir * amp * 0.16 * rnd(),
              duration: JIT_STEP,
              ease: "sine.inOut",
            },
            CUES.jitter + k * JIT_STEP,
          );
        }
        tl.to(el, { x: 0, y: 0, rotation: 0, duration: CUES.ufitom - jitSettleAt, ease: "power2.out" }, jitSettleAt);
      });

      // Scene 4 — on "ופתאום" the whole cluster jolts once, tilts askew and dims (stays readable, pushed back).
      const cluster = $("02-pain-cluster");
      const JOLT = 0.09;
      tl.fromTo(
        cluster,
        { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 },
        { x: -30, y: 6, rotation: 4.5, scale: 1, opacity: 0.85, duration: JOLT, ease: "power2.out", immediateRender: false },
        CUES.ufitom,
      );
      tl.to(cluster, { x: -10, y: 10, rotation: 3, scale: 0.96, opacity: 0.45, duration: 0.7, ease: "power3.out" }, CUES.ufitom + JOLT);

      // Scenes 4–5 — headline per word (dynamic-content-sequencing: each line anchors to its VO cue,
      // word starts inside a line are pre-computed ONCE from content length, then tweened).
      const LINES = [
        { cue: CUES.ufitom, ids: ["02-pain-w1"], punch: true },
        { cue: CUES.kolHachlata, ids: ["02-pain-w2", "02-pain-w3", "02-pain-w4"] },
        { cue: CUES.masaUmatan, ids: ["02-pain-w5", "02-pain-w6"] },
      ];
      const WORD_BASE = 0.06;
      const SEC_PER_CHAR = 0.035;
      const WORD_TIMELINE = [];
      LINES.forEach((line) => {
        let t = line.cue;
        line.ids.forEach((id) => {
          const el = $(id);
          WORD_TIMELINE.push({ el, start: t, punch: !!line.punch });
          t += WORD_BASE + el.textContent.trim().length * SEC_PER_CHAR;
        });
      });
      WORD_TIMELINE.forEach(({ el, start, punch }) => {
        if (punch) {
          tl.fromTo(
            el,
            { opacity: 0, y: 40, scale: 1.12 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" },
            start + 0.02,
          );
        } else {
          tl.fromTo(el, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, start);
        }
      });

      // "משא ומתן." — heart-red underline draws right→left (css-marker-patterns highlight mode), then hold still.
      tl.fromTo($("02-pain-ulbar"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, CUES.underline);

      window.__timelines["02-pain"] = tl;
    })();
  </script>
</template>
