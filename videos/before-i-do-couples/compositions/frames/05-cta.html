        line2: 1.0,  // "לפני כל השאר"
        brand: 2.4,  // "Before I Do"
        hold: 3.4,   // everything settled — held still to the last frame
        end: 4.0
      };

      const el = (id) => document.getElementById(id);
      const photo = el("05-cta-photo");
      const line1 = el("05-cta-line1");
      const line2 = el("05-cta-line2");
      const card = el("05-cta-card");
      const ink = el("05-cta-ink");
      const heart = el("05-cta-heart");
      const pill = el("05-cta-pill");

      const tl = gsap.timeline({ paused: true });

      // Scene 1–4 camera: the only camera motion — a barely perceptible push across the whole frame,
      // easing out so the last beat reads as still (clean loop point).
      tl.fromTo(photo, { scale: 1 }, { scale: 1.04, duration: CUES.end, ease: "sine.out" }, 0);

      // Scene 1: "שיחה אחת," fades up with a small rise and settles.
      tl.fromTo(line1, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, CUES.line1);

      // Scene 2: "לפני כל השאר." follows on its cue, same move.
      tl.fromTo(line2, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, CUES.line2);

      // Scene 3: lockup card rises into place …
      tl.fromTo(card, { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, CUES.brand);

      // … the Caveat wordmark writes on left→right (heart revealed last) …
      tl.fromTo(
        ink,
        { clipPath: "inset(-30% 104% -30% -4%)" },
        { clipPath: "inset(-30% -6% -30% -4%)", duration: 0.55, ease: "power1.inOut" },
        CUES.brand + 0.1
      );

      // … the red heart beats once (one pulse, no loop) …
      tl.fromTo(heart, { scale: 1 }, { scale: 1.22, duration: 0.12, ease: "power2.out" }, CUES.brand + 0.66);
      tl.to(heart, { scale: 1, duration: 0.22, ease: "power2.inOut" }, CUES.brand + 0.78);

      // … and the URL pill fades up beneath, settled by the hold.
      tl.fromTo(pill, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUES.brand + 0.5);

      // Scene 4 (CUES.hold → CUES.end): no tweens — everything holds still. No exit.

      window.__timelines["05-cta"] = tl;
    })();
  </script>
</template>
