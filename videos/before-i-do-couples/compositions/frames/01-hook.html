        <div id="01-hook-s2" class="01-hook-stmt" dir="rtl" lang="he">
          <div class="01-hook-line"><span class="01-hook-w" data-cue="hemPashut" data-step="0" data-move="soft">הם</span> <span class="01-hook-w" data-cue="hemPashut" data-step="1" data-move="soft">פשוט</span> <span class="01-hook-w" data-cue="afPaam" data-step="0" data-move="soft">אף</span> <span class="01-hook-w" data-cue="afPaam" data-step="1" data-move="soft">פעם</span></div>
          <div class="01-hook-line"><span class="01-hook-w" data-cue="diberu" data-step="-1" data-move="land">לא</span> <span id="01-hook-key" class="01-hook-w" data-cue="diberu" data-step="0" data-move="land"><span id="01-hook-ul"></span><span id="01-hook-key-txt" class="01-hook-key-txt">דיברו</span></span> <span class="01-hook-w" data-cue="diberu" data-step="1" data-move="land">עליה.</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // ── Every timing lives here. Re-time to the recorded VO by editing numbers only. ──
      const CUES = {
        rov: 0.1, //          "רוב"  (… הזוגות)
        loRavim: 0.9, //      "לא רבים"
        alHachatuna: 1.4, //  "על החתונה"
        hemPashut: 2.2, //    "הם פשוט"  — then a deliberate half-beat of stillness
        afPaam: 3.0, //       "אף פעם"
        diberu: 3.6, //       "דיברו"   ("לא" lands one step before, "עליה." one after)
        end: 4.5,
        step: 0.2, //         gap between consecutive words inside one spoken phrase
        ulDelay: 0.1, //      underline + white flip start, after "דיברו" begins landing
        ulDur: 0.5,
        idleLead: 0.88, //    hold-jitter starts this long after "על החתונה" (statement 1 settled)
      };

      const tl = gsap.timeline({ paused: true });

      const drift = document.getElementById("01-hook-drift");
      const words = drift.querySelectorAll("[data-cue]");
      const ul = document.getElementById("01-hook-ul");
      const keyTxt = document.getElementById("01-hook-key-txt");

      const at = (el) => CUES[el.getAttribute("data-cue")] + Number(el.getAttribute("data-step")) * CUES.step;

      words.forEach((w) => {
        const move = w.getAttribute("data-move");
        const t = at(w);
        if (move === "rise") {
          // Scenes 1–2: per-word rise out of the line mask — confident first statement.
          tl.fromTo(w, { yPercent: 118 }, { yPercent: 0, duration: 0.62, ease: "expo.out" }, t);
        } else if (move === "soft") {
          // Scene 3: second statement drifts in right→left and de-blurs — hesitant, quieter.
          tl.fromTo(
            w,
            { opacity: 0, x: 44, filter: "blur(10px)" },
            { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.75, ease: "power3.out" },
            t,
          );
        } else {
          // Scene 4: "לא דיברו עליה." lands firmer (same direction, shorter settle).
          tl.fromTo(
            w,
            { opacity: 0, x: 44, filter: "blur(8px)" },
            { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
            t,
          );
        }
      });

      // Scene 4 payoff — css-marker-patterns highlight/underline sweep, drawn right→left
      // (transform-origin: right), while "דיברו" flips from tint to white.
      const ulAt = CUES.diberu + CUES.ulDelay;
      tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: CUES.ulDur, ease: "power2.out" }, ulAt);
      tl.fromTo(
        keyTxt,
        { color: "#DDE7F5" },
        { color: "#FFFFFF", duration: CUES.ulDur * 0.7, ease: "power2.out" },
        ulAt,
      );

      // Hold — sine-wave-loop, subtle jitter at the low end (2.5px). One continuous
      // phase tween on the whole headline wrapper (nothing else animates it), starting
      // once statement 1 has settled; sin(0)=0 at start and sin(2π)=0 at the end, so the
      // landed state is exactly the approved sketch.
      const IDLE_START = CUES.alHachatuna + CUES.idleLead;
      const IDLE_DUR = CUES.end - IDLE_START;
      const Y_AMP_PX = 2.5;
      const CYCLES = 1;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            drift.style.transform = "translateY(" + (Math.sin(phase.p) * Y_AMP_PX).toFixed(3) + "px)";
          },
        },
        IDLE_START,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
