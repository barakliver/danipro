          <div id="02-reveal-line-b" class="02-reveal-line"><span id="02-reveal-hero" class="02-reveal-hero"><span id="02-reveal-jit" class="02-reveal-jit"><span id="02-reveal-slam" class="02-reveal-slam"><span id="02-reveal-echo-2" class="02-reveal-echo 02-reveal-echo-2" aria-hidden="true">אשכרה</span><span id="02-reveal-echo-1" class="02-reveal-echo 02-reveal-echo-1" aria-hidden="true">אשכרה</span><span id="02-reveal-core" class="02-reveal-core">אשכרה</span></span><span id="02-reveal-ul" class="02-reveal-ul"></span></span></span> <span id="02-reveal-w-tzrichim" class="02-reveal-w">צריכים</span></div>
          <div id="02-reveal-line-c" class="02-reveal-line"><span id="02-reveal-w-achshav" class="02-reveal-w">עכשיו<span id="02-reveal-dot" class="02-reveal-dot">.</span></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // ── All timing lives here (seconds, frame-local). Re-time to the recorded VO by editing numbers only.
      const CUES = {
        kavod: 0.05, // "עם כל הכבוד" — lead-in starts typing
        matana: 1.6, // "זו המתנה"
        hamatana: 1.74, // "המתנה"
        shehem: 2.25, // "שהם"
        ashkara: 2.6, // "אשכרה" — the slam
        tzrichim: 2.95, // "צריכים"
        achshav: 3.4, // "עכשיו"
        end: 4.5,
      };
      const SLAM_IN = 0.17; // approach length; impact lands at CUES.ashkara + SLAM_IN

      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 — lead-in types on with a wry pace (discrete-text-sequence:
      //    word-cluster keystrokes, a wry hold before "למצעים", slow trailing dots).
      const LEAD = "עם כל הכבוד למצעים...";
      const KEYS = [
        // [offset from CUES.kavod, chars shown]
        [0.0, 1], [0.05, 2],
        [0.12, 4], [0.17, 5],
        [0.27, 7], [0.32, 8], [0.37, 9], [0.42, 10], [0.47, 11],
        // wry hold …
        [0.8, 13], [0.86, 14], [0.92, 15], [0.98, 16], [1.04, 17], [1.1, 18],
        [1.24, 19], [1.34, 20], [1.44, 21],
      ];
      const SEQUENCE = [{ t: 0, text: "" }].concat(
        KEYS.map(([o, n]) => ({ t: CUES.kavod + o, text: LEAD.substring(0, n) })),
      );
      const T_DONE = SEQUENCE[SEQUENCE.length - 1].t;
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const typedEl = $("02-reveal-typed");
      const cursorEl = $("02-reveal-cursor");
      const drv = { t: 0 };
      tl.fromTo(
        drv,
        { t: 0 },
        {
          t: CUES.end,
          duration: CUES.end,
          ease: "none",
          lazy: false,
          onUpdate: function () {
            const t = this.time(); // tween-local time == timeline time (starts at 0)
            typedEl.textContent = textAt(t);
            // caret: solid while keys land, sin square-wave blink in the holds, gone once typed
            const live = t < T_DONE + 0.08;
            const blink = Math.sin((2 * Math.PI * t) / 0.55 + 1.2) > -0.35;
            cursorEl.style.opacity = live && blink ? "1" : "0";
          },
        },
        0,
      );

      // ── Scene 2 — "זו המתנה שהם" reveals word by word on the voice.
      [
        ["02-reveal-w-zo", CUES.matana],
        ["02-reveal-w-hamatana", CUES.hamatana],
        ["02-reveal-w-shehem", CUES.shehem],
      ].forEach(([id, at]) => {
        tl.fromTo(
          $(id),
          { y: 64, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          at,
        );
      });

      // ── Scene 3 — "אשכרה" SLAMS (kinetic-beat-slam): oversized + motion-blurred,
      //    drives down onto the table, compresses on impact, long heavy settle (no bounce).
      const slam = $("02-reveal-slam");
      const IMPACT = CUES.ashkara + SLAM_IN;
      tl.fromTo(slam, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, CUES.ashkara);
      tl.fromTo(
        slam,
        { scale: 2.8, rotation: -7, filter: "blur(18px)" },
        { scale: 0.92, rotation: 0, filter: "blur(0px)", duration: SLAM_IN, ease: "power2.in" },
        CUES.ashkara,
      );
      tl.fromTo(
        slam,
        { scale: 0.92 },
        { scale: 1, duration: 0.62, ease: "power2.out", immediateRender: false },
        IMPACT,
      );
      // trailing echoes (z motion-blur streak) catch up and sink under the core
      tl.fromTo(
        $("02-reveal-echo-1"),
        { scale: 1.3 },
        { scale: 1, duration: SLAM_IN + 0.09, ease: "power2.in" },
        CUES.ashkara,
      );
      tl.fromTo(
        $("02-reveal-echo-2"),
        { scale: 1.65 },
        { scale: 1, duration: SLAM_IN + 0.16, ease: "power2.in" },
        CUES.ashkara,
      );

      // reactive displacement — the struck lines above get knocked up, then settle heavy
      [
        ["02-reveal-lead", -9],
        ["02-reveal-line-a", -18],
      ].forEach(([id, dy]) => {
        tl.fromTo($(id), { y: 0 }, { y: dy, duration: 0.06, ease: "power2.out" }, IMPACT);
        tl.fromTo(
          $(id),
          { y: dy },
          { y: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
          IMPACT + 0.06,
        );
      });

      // heart-red underline sweeps right → left under the hero
      tl.fromTo(
        $("02-reveal-ul"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out" },
        IMPACT + 0.04,
      );

      // "צריכים" snaps in from the left, nudged into place by the hit
      tl.fromTo(
        $("02-reveal-w-tzrichim"),
        { x: -110, opacity: 0, filter: "blur(10px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
        CUES.tzrichim,
      );

      // ── Scene 4 — "עכשיו." lands (heavy rise), the full stop pops, then a held read.
      tl.fromTo(
        $("02-reveal-w-achshav"),
        { y: 120, rotation: -6, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        CUES.achshav,
      );
      tl.fromTo(
        $("02-reveal-dot"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(3)" },
        CUES.achshav + 0.24,
      );

      // hold: subtle dual-frequency jitter on the resting hero (sine-wave register, no yoyo)
      const jit = $("02-reveal-jit");
      const J0 = CUES.achshav;
      const JDUR = CUES.end - J0;
      const jp = { t: 0 };
      tl.fromTo(
        jp,
        { t: 0 },
        {
          t: JDUR,
          duration: JDUR,
          ease: "none",
          lazy: false,
          onUpdate: function () {
            const t = this.time(); // seconds since the hold began
            const env = Math.min(1, t / 0.3);
            const TAU = 2 * Math.PI;
            const r = env * 0.9 * (0.7 * Math.sin(TAU * 1.15 * t) + 0.3 * Math.sin(TAU * 2.7 * t + 1.3));
            const s = 1 + env * 0.012 * (0.7 * Math.sin(TAU * 1.6 * t + 0.4) + 0.3 * Math.sin(TAU * 3.3 * t));
            gsap.set(jit, { rotation: r, scale: s });
          },
        },
        J0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-reveal"] = tl;
    })();
  </script>
</template>
