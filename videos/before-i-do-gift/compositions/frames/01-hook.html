      <div id="f01-hook-sub" dir="rtl" lang="he"><span class="f01-hook-w" id="f01-hook-w1">מגיעה</span> <span class="f01-hook-w" id="f01-hook-w2">להם</span> <span class="f01-hook-w" id="f01-hook-w3">מתנה.</span> <span class="f01-hook-w" id="f01-hook-w4">אז</span><span class="f01-hook-w" id="f01-hook-d1">.</span><span class="f01-hook-w" id="f01-hook-d2">.</span><span class="f01-hook-w" id="f01-hook-d3">.</span></div>

      <div id="f01-hook-reel" dir="rtl" lang="he">
        <div class="f01-hook-item" id="f01-hook-i0"><span class="f01-hook-txt" id="f01-hook-t0">מגבות עם רקמה?</span></div>
        <div class="f01-hook-item" id="f01-hook-i1">
          <div id="f01-hook-win" data-layout-allow-overflow>
            <div id="f01-hook-sp1"><div id="f01-hook-sp2"><div id="f01-hook-sp3">
              <div class="f01-hook-cell"></div>
              <div class="f01-hook-cell f01-hook-cell-fit">מסגרת עם השמות?</div>
              <div class="f01-hook-cell">מגבות עם רקמה?</div>
              <div class="f01-hook-cell"><span class="f01-hook-sw" id="f01-hook-sw1">עוד סט מצעים?<span class="f01-hook-strike"><span class="f01-hook-press" id="f01-hook-press1"><span class="f01-hook-bar" id="f01-hook-bar1"></span></span></span></span></div>
            </div></div></div>
          </div>
        </div>
        <div class="f01-hook-item" id="f01-hook-i2"><span class="f01-hook-txt" id="f01-hook-t2"><span class="f01-hook-sw" id="f01-hook-sw2">מסגרת עם השמות?<span class="f01-hook-strike"><span class="f01-hook-press" id="f01-hook-press2"><span class="f01-hook-bar" id="f01-hook-bar2"></span></span></span></span></span></div>
        <div class="f01-hook-item" id="f01-hook-i3"><span class="f01-hook-txt" id="f01-hook-t3">מגבות עם רקמה?</span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Every timing lives here — re-time to the recorded VO by editing numbers only.
      const CUES = {
        chaverim: 0.05, // "החברים התארסו" — title types on
        heart: 0.7, //     heart pops after the title
        magia: 1.1, //     "מגיעה להם מתנה" — per-word reveal
        az: 2.2, //        "אז..." — ellipsis; slot column appears, center slot empty
        sadin: 2.7, //     "עוד סט מצעים" — center slot spins and lands
        strike1: 3.3, //   end of "עוד סט מצעים?" — first strike
        misgeret: 3.8, //  "מסגרת עם השמות" — reel rolls one step
        strike2: 4.4, //   end of "מסגרת עם השמות?" — second strike
        end: 5.0,
      };

      const tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0-1.1): title types on (discrete-text-sequence, smooth slice) ----------
      // Each character is revealed in place. The right (RTL start) edge is fixed, so it reads exactly
      // like a growing substring, but stays seek-safe without onUpdate callbacks.
      const typeEl = document.getElementById("f01-hook-type");
      const FULL = typeEl.textContent;
      typeEl.textContent = "";
      Array.from(FULL).forEach((ch) => {
        const s = document.createElement("span");
        s.className = "f01-hook-ch";
        s.textContent = ch;
        typeEl.appendChild(s);
      });
      tl.fromTo(
        "#f01-hook-type .f01-hook-ch",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none", stagger: { amount: 0.58, ease: "power1.inOut" } },
        CUES.chaverim,
      );
      // small red heart pops after it (playful overshoot)
      tl.fromTo(
        "#f01-hook-heart",
        { scale: 0, rotation: -28, y: 10 },
        { scale: 1, rotation: 0, y: 0, duration: 0.55, ease: "back.out(2.8)" },
        CUES.heart,
      );

      // ---------- Scene 2 (1.1-2.1): "מגיעה להם מתנה. אז..." reveals per word ----------
      const WORD_IN = { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "expo.out" };
      tl.fromTo("#f01-hook-w1", { opacity: 0, x: 6, y: 26 }, WORD_IN, CUES.magia);
      tl.fromTo("#f01-hook-w2", { opacity: 0, x: 6, y: 26 }, WORD_IN, CUES.magia + 0.2);
      tl.fromTo("#f01-hook-w3", { opacity: 0, x: 6, y: 26 }, WORD_IN, CUES.magia + 0.4);
      tl.fromTo("#f01-hook-w4", { opacity: 0, x: 6, y: 26 }, WORD_IN, CUES.az);
      // the ellipsis ticks in dot by dot — the comic pause
      tl.fromTo("#f01-hook-d1", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, CUES.az + 0.16);
      tl.fromTo("#f01-hook-d2", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, CUES.az + 0.26);
      tl.fromTo("#f01-hook-d3", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, CUES.az + 0.36);

      // ---------- Reel geometry (from the approved sketch) ----------
      const CELL_H = 176; //            center window = one cell (~1.3 x 135px)
      const GAP = 159.8; //             slot pitch: row centers at y 545.7 / 705.5 / 865.2
      const GHOST = 86.4 / 135; //      ghost rows are 86.4px type vs the 135px center
      const SLOT = {
        "-2": { y: -280, scale: 0.54, opacity: 0 },
        "-1": { y: -GAP, scale: GHOST, opacity: 0.28 },
        0: { y: 0, scale: 1, opacity: 1 },
        1: { y: GAP, scale: GHOST, opacity: 0.28 },
        2: { y: 280, scale: 0.54, opacity: 0 },
      };
      // fit = center-slot scale; "מסגרת עם השמות?" is 1027px wide at 135px -> fit to the 961px measure
      const slot = (d, fit) => Object.assign({}, SLOT[d], d === 0 ? { scale: fit } : {});

      // ---------- Scene 3 (2.2-2.7): the slot column appears, center slot empty ----------
      tl.fromTo("#f01-hook-t0", { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, CUES.az + 0.04);
      tl.fromTo("#f01-hook-t2", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, CUES.az + 0.1);

      // ---------- Scene 4 (2.7-3.8): center slot spins up and clicks onto "עוד סט מצעים?" ----------
      // vertical-spring-ticker: one back.out spring per step, ADDED together. Each spring owns one
      // nested translate (sp1 > sp2 > sp3), so the steps sum and each keeps its own snap.
      // Two fast pre-steps, then the dramatic landing step with a bigger bounce.
      tl.fromTo("#f01-hook-sp1", { y: 0 }, { y: -CELL_H, duration: 0.26, ease: "back.out(1.4)" }, CUES.sadin - 0.12);
      tl.fromTo("#f01-hook-sp2", { y: 0 }, { y: -CELL_H, duration: 0.26, ease: "back.out(1.4)" }, CUES.sadin - 0.04);
      tl.fromTo("#f01-hook-sp3", { y: 0 }, { y: -CELL_H, duration: 0.5, ease: "back.out(2.2)" }, CUES.sadin + 0.04);
      // motion blur while the reel spins (clipped by the slot window)
      tl.fromTo(
        "#f01-hook-sp1",
        { filter: "blur(0px)" },
        { filter: "blur(7px)", duration: 0.12, ease: "power1.in", immediateRender: false },
        CUES.sadin - 0.12,
      );
      tl.fromTo(
        "#f01-hook-sp1",
        { filter: "blur(7px)" },
        { filter: "blur(0px)", duration: 0.24, ease: "power2.out", immediateRender: false },
        CUES.sadin + 0.1,
      );

      // css-marker-patterns (strike): heart-red bar draws right -> left (origin right), with a tiny
      // snap: the stroke overshoots its length and settles, lands heavy then thins, and knocks the
      // struck words a few px.
      const strike = (n, at) => {
        tl.fromTo("#f01-hook-bar" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "back.out(1.6)" }, at);
        tl.fromTo("#f01-hook-press" + n, { scaleY: 1.7 }, { scaleY: 1, duration: 0.42, ease: "power3.out" }, at);
        tl.fromTo(
          "#f01-hook-sw" + n,
          { x: 0 },
          { x: -7, duration: 0.05, ease: "power2.out", immediateRender: false },
          at + 0.18,
        );
        tl.fromTo(
          "#f01-hook-sw" + n,
          { x: -7 },
          { x: 0, duration: 0.3, ease: "power3.out", immediateRender: false },
          at + 0.23,
        );
      };
      strike(1, CUES.strike1);

      // ---------- Scene 5 (3.8-5.0): the ticker rolls one step ----------
      // struck "עוד סט מצעים?" rises to the ghost row (keeping its strike), "מסגרת עם השמות?" rolls
      // into the center slot, a new "מגבות עם רקמה?" slides into the lower slot, and the old top
      // ghost rolls off the reel.
      const ROLL_AT = CUES.misgeret - 0.1;
      const ROLL = { duration: 0.55, ease: "back.out(1.7)" };
      tl.fromTo("#f01-hook-i0", slot(-1, 1), Object.assign(slot(-2, 1), ROLL), ROLL_AT);
      tl.fromTo("#f01-hook-i1", slot(0, 1), Object.assign(slot(-1, 1), ROLL), ROLL_AT);
      tl.fromTo("#f01-hook-i2", slot(1, 0.8), Object.assign(slot(0, 0.8), ROLL), ROLL_AT);
      tl.fromTo("#f01-hook-i3", slot(2, 1), Object.assign(slot(1, 1), ROLL), ROLL_AT);
      tl.fromTo(
        "#f01-hook-reel",
        { filter: "blur(0px)" },
        { filter: "blur(2.5px)", duration: 0.1, ease: "power1.in", immediateRender: false },
        ROLL_AT,
      );
      tl.fromTo(
        "#f01-hook-reel",
        { filter: "blur(2.5px)" },
        { filter: "blur(0px)", duration: 0.25, ease: "power2.out", immediateRender: false },
        ROLL_AT + 0.1,
      );
      strike(2, CUES.strike2);

      // hold to the end of the frame (no exit — the root transition owns it)
      tl.set({}, {}, CUES.end);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
