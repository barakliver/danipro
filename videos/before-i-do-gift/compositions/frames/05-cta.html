  <style>
    /* Frame root — styled by #root only (never a class on the composition root). No background here:
       the full-bleed ground is the timed clip layer below. */
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Assistant", sans-serif;
      color: #1F2C4A;
    }

    /* ── Ground clip: white base + the box photo under a slow push, top white wash ── */
    [id="05-cta-ground"] {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #FFFFFF;
    }
    [id="05-cta-cam"] {
      position: absolute;
      inset: 0;
      transform-origin: 50% 58%;
      will-change: transform;
    }
    [id="05-cta-photo"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 70%;
    }
    [id="05-cta-shade"] {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.55) 34%,
        rgba(255, 255, 255, 0) 52%);
    }

    /* ── Lockup column (sketch .safe: top 14cqw, side 5.5cqw) ── */
    [id="05-cta-lockup"] {
      position: absolute;
      top: 151px;
      left: 59px;
      right: 59px;
      text-align: center;
      direction: rtl;
    }

    /* Wordmark: Caveat 600, blue, 15cqw = 162px, line-height 1, LTR, heart after "Do" */
    [id="05-cta-wm"] {
      font-family: "Caveat", cursive;
      font-weight: 600;
      font-size: 162px;
      line-height: 1;
      color: #4F6BA5;
      direction: ltr;
      unicode-bidi: isolate;
      white-space: nowrap;
    }
    /* Write-on mask: a feathered left→right edge driven by --wm-p.
       Padding + matching negative margin keep Caveat's swashes inside the mask box. */
    [id="05-cta-wmtext"] {
      --wm-p: 100%;
      display: inline-block;
      padding: 0.18em 0.14em;
      margin: -0.18em -0.14em;
      -webkit-mask-image: linear-gradient(90deg, #000 var(--wm-p), rgba(0, 0, 0, 0) calc(var(--wm-p) + 14%));
      mask-image: linear-gradient(90deg, #000 var(--wm-p), rgba(0, 0, 0, 0) calc(var(--wm-p) + 14%));
    }
    [id="05-cta-heart"] {
      display: inline-block;
      width: 1em;
      height: 0.92em;
      vertical-align: -0.08em;
      margin-left: 0.2em;
      transform-origin: 50% 55%;
      will-change: transform;
    }
    [id="05-cta-heart"] svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Pill chrome (100px radius, Assistant 600) */
    [class~="05-cta-pill"] {
      display: inline-block;
      border-radius: 100px;
      padding: 17px 45px;
      font-family: "Assistant", sans-serif;
      font-weight: 600;
      font-size: 60px;
      line-height: 1.25;
      color: #FFFFFF;
      white-space: nowrap;
    }

    /* Gift tag — heart-red, hangs from a pivot above its top edge */
    [id="05-cta-tagrow"] {
      margin-top: 32px;
    }
    [id="05-cta-tag"] {
      background: #EF453D;
      transform-origin: 50% -60%;
      will-change: transform, opacity;
    }

    /* Wink line — ink-deep 600, ~50px, two lines */
    [id="05-cta-wink"] {
      margin-top: 43px;
      font-family: "Assistant", sans-serif;
      font-weight: 600;
      font-size: 50px;
      line-height: 1.3;
      color: #1F2C4A;
      will-change: transform, opacity;
    }

    /* URL pill — the one solid blue CTA, y ≈ 1210 (sketch top:112cqw) */
    [id="05-cta-urlrow"] {
      position: absolute;
      top: 1210px;
      left: 0;
      right: 0;
      text-align: center;
    }
    [id="05-cta-url"] {
      background: #4F6BA5;
      direction: ltr;
      unicode-bidi: isolate;
      will-change: transform, opacity;
    }
  </style>

  <script>
    (function () {
      // All timing lives here — re-time to the recorded VO by editing numbers only.
      // Packet cues: "Before I Do" 0.05 · "מגיע ארוז" 1.1 · "ומוכן למסירה" 1.8 · end 3.5
      const CUES = {
        wordmark: 0.05, // "Before I Do" — wordmark writes on left→right
        heart: 0.72,    // heart pops as the write-on reaches "Do"
        tag: 1.1,       // "מגיע ארוז" — gift tag swings in
        ready: 1.8,     // "ומוכן למסירה" — tag settles to rest just after this word lands
        wink: 2.2,      // wink line fades up
        url: 2.35,      // URL pill fades up
        end: 3.5,       // frame end — everything is still from ~2.9s (clean loop point)
      };

      const el = (id) => document.getElementById(id);
      const cam = el("05-cta-cam");
      const wmText = el("05-cta-wmtext");
      const heart = el("05-cta-heart");
      const tag = el("05-cta-tag");
      const wink = el("05-cta-wink");
      const url = el("05-cta-url");

      const tl = gsap.timeline({ paused: true });

      // Scene 1–4 underlay: barely perceptible push on the photo, 1.00 → 1.04 across the whole frame.
      // Decelerating curve so the last ~0.6s is effectively still (held end card / loop point).
      tl.fromTo(
        cam,
        { scale: 1 },
        { scale: 1.04, duration: CUES.end - 0.05, ease: "power1.out" },
        0
      );

      // Scene 1 (0.0–1.0s): wordmark writes on left→right via a feathered mask edge.
      tl.fromTo(
        wmText,
        { "--wm-p": "-14%" },
        { "--wm-p": "100%", duration: 0.8, ease: "power1.inOut" },
        CUES.wordmark
      );
      // Red heart pops once (small playful overshoot is allowed on the heart only).
      tl.fromTo(
        heart,
        { scale: 0, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.6)" },
        CUES.heart
      );

      // Scene 2 (1.1–2.2s): heart-red gift tag swings in from a pivot above it —
      // small rotation settling to 0, smooth (bottom edge travels right → left).
      const tagDur = CUES.ready + 0.2 - CUES.tag;
      tl.fromTo(
        tag,
        { rotation: -9, y: -26, scale: 0.94 },
        { rotation: 0, y: 0, scale: 1, duration: tagDur, ease: "power3.out" },
        CUES.tag
      );
      tl.fromTo(
        tag,
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out" },
        CUES.tag
      );

      // Scene 3 (2.2–2.9s): wink line, then the URL pill, fade up.
      tl.fromTo(
        wink,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        CUES.wink
      );
      tl.fromTo(
        url,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        CUES.url
      );

      // Scene 4 (2.9–3.5s): hold perfectly still to the last frame. No exit.

      window.__timelines = window.__timelines || {};
      window.__timelines["05-cta"] = tl;
    })();
