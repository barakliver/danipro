  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Assistant", sans-serif;
      color: #1F2C4A;
    }

    /* ---- ground: full-bleed canvas-alt on its own clip layer ---- */
    .\30 3-cards-ground {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      background: #F1F4F9;
    }

    /* ---- card stage (macro push, origin pinned at the cluster's bottom so the caption band stays clear) ---- */
    .\30 3-cards-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 540px 1172px;
    }

    /* supporting card: fingerprint-heart back, behind-left, settles at rotate(-10deg) */
    .\30 3-cards-back {
      position: absolute;
      left: 154px;
      top: 450px;
      width: 447px;
      height: 671px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(31, 44, 74, 0.18);
      z-index: 1;
    }
    .\30 3-cards-back img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* hero card: position wrapper (2D: x / rotation / scale) + perspective for the 3D flipper */
    .\30 3-cards-dog {
      position: absolute;
      left: 357px;
      top: 389px;
      width: 508px;
      height: 762.5px;
      perspective: 1800px;
      perspective-origin: 50% 50%;
      z-index: 2;
    }
    .\30 3-cards-flip {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      z-index: 1;
    }
    .\30 3-cards-face {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 12px 30px rgba(31, 44, 74, 0.2);
    }
    .\30 3-cards-face img {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* static pre-rotation of the front face (never tweened) */
    .\30 3-cards-face-front {
      transform: rotateY(180deg);
    }

    /* css-marker-patterns · circle mode — ring around the card's printed "או" */
    .\30 3-cards-ring {
      position: absolute;
      left: 199px;
      top: 195px;
      width: 110px;
      height: 76px;
      border: 6px solid #EF453D;
      border-radius: 52% 48% 55% 45% / 50% 56% 44% 50%;
      z-index: 2;
    }

    /* ---- counter row (sketch: top-right, 70 + label, baseline aligned) ---- */
    .\30 3-cards-count-row {
      position: absolute;
      left: 59px;
      right: 59px;
      top: 130px;
      display: flex;
      align-items: baseline;
      gap: 26px;
    }
    .\30 3-cards-count {
      display: inline-block;
      width: 2ch;
      text-align: center;
      font-size: 162px;
      font-weight: 700;
      line-height: 1;
      color: #4F6BA5;
      font-variant-numeric: tabular-nums;
      transform-origin: 50% 70%;
    }
    .\30 3-cards-count-label {
      font-size: 65px;
      font-weight: 600;
      line-height: 1;
      color: #1F2C4A;
      white-space: nowrap;
    }

    /* ---- verdict chips (y 1060–1170, right edge at x 920) ---- */
    .\30 3-cards-chips {
      position: absolute;
      left: 60px;
      top: 1060px;
      width: 860px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      z-index: 3;
    }
    .\30 3-cards-chip {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 104px;
      padding: 0 34px 0 22px;
      background: #FFFFFF;
      border: 1.5px solid rgba(79, 107, 165, 0.2);
      border-radius: 100px;
      box-shadow: 0 10px 24px rgba(31, 44, 74, 0.16);
    }
    .\30 3-cards-chip-text {
      font-size: 58px;
      font-weight: 600;
      line-height: 1;
      color: #1F2C4A;
      white-space: nowrap;
    }
    .\30 3-cards-chip-yes .\30 3-cards-chip-text {
      color: #4F6BA5;
      font-weight: 700;
    }
    .\30 3-cards-chip-icon {
      display: block;
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
    }
    .\30 3-cards-chip-icon svg {
      display: block;
      width: 60px;
      height: 60px;
    }
    .\30 3-cards-check {

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // Every timing lives here — re-time to the recorded VO by editing numbers only.
      const CUES = {
        dog: 0.05, //        "להביא את הכלב"  → card flips from its back to the dog face
        ou: 1.4, //          "או להשאיר"      → ring on the printed "או" + second card back slides in
        shivim: 2.7, //      "שבעים שאלות"    → 0→70 counter
        basalon: 4.4, //     "בסלון"          → ✓ chip
        mulHasapak: 5.2, //  "מול הספק"       → ✕ chip + strike
        end: 6.0,
      };

      const ROOT = document.querySelector('[data-composition-id="03-cards"]') || document;
      const el = (c) => ROOT.getElementsByClassName(c)[0];

      const stage = el("03-cards-stage");
      const back = el("03-cards-back");
      const dog = el("03-cards-dog");
      const flip = el("03-cards-flip");
      const ring = el("03-cards-ring");
      const count = el("03-cards-count");
      const countLabel = el("03-cards-count-label");
      const chipYes = el("03-cards-chip-yes");
      const chipNo = el("03-cards-chip-no");
      const check = el("03-cards-check");
      const iconNo = el("03-cards-icon-no");
      const strikeBar = el("03-cards-strike-bar");
      const noText = el("03-cards-no-text");

      // dog card starts centred on the canvas (x 540), lands on the sketch's front-right anchor
      const START_DX = 540 - (357 + 508 / 2);

      const tl = gsap.timeline({ paused: true });

      // ── Macro camera: slow push on the card stage for the whole shot (bottom-pinned) ──
      tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: CUES.end, ease: "sine.inOut" }, 0);

      // ── Scene 1 (0.0–1.4): the card shown from its back flips in 3D to the dog face ──
      // flip: rotateY 0→180 with a split-tilt style pivot (wind-up + overshoot, then settle)
      tl.fromTo(flip, { rotationY: 0 }, { rotationY: 180, duration: 1.15, ease: "back.inOut(1.1)" }, CUES.dog);
      // travel from centre to the front-right anchor, tilting to +5°
      tl.fromTo(dog, { x: START_DX, rotation: 0 }, { x: 0, rotation: 5, duration: 1.2, ease: "power3.inOut" }, CUES.dog);
      // lift during the turn, settle on landing
      tl.fromTo(dog, { scale: 0.95 }, { scale: 1.06, duration: 0.6, ease: "power2.inOut" }, CUES.dog);
      tl.to(dog, { scale: 1, duration: 0.65, ease: "power3.out" }, CUES.dog + 0.6);

      // ── Scene 2 (1.4–2.6): marker circle on "או", second card back slides in behind-left ──
      tl.fromTo(ring, { scale: 0, rotation: -14, opacity: 1 }, { scale: 1, rotation: -3, duration: 0.6, ease: "back.out(1.7)" }, CUES.ou);
      tl.fromTo(
        back,
        { x: -700, rotation: -26, rotationY: 30, transformPerspective: 1400, opacity: 0 },
        { x: 0, rotation: -10, rotationY: 0, transformPerspective: 1400, opacity: 1, duration: 0.9, ease: "power3.out" },
        CUES.ou + 0.05,
      );
      // counter-phase idle drift (one-way) once both cards are down
      tl.to(dog, { y: -8, duration: CUES.end - (CUES.ou + 0.9), ease: "sine.inOut" }, CUES.ou + 0.9);
      tl.to(back, { y: 8, duration: CUES.end - (CUES.ou + 0.95), ease: "sine.inOut" }, CUES.ou + 0.95);

      // ── Scene 3 (2.7–3.9): counter 0→70 with dynamic scale, label reveals beside it ──
      const COUNT_DUR = 1.2;
      const counter = { v: 0 };
      tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, CUES.shivim);
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 70,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: () => {
            count.textContent = String(Math.round(counter.v));
          },
        },
        CUES.shivim,
      );
      tl.fromTo(count, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, CUES.shivim);
      tl.fromTo(countLabel, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, CUES.shivim + 0.35);

      // ── Scene 4 (3.9–6.0): verdict chips — "בסלון" ✓ then "מול הספק" struck ✕ ──
      tl.fromTo(
        chipYes,
        { opacity: 0, scale: 0.5, y: 26, rotation: -9 },
        { opacity: 1, scale: 1, y: 0, rotation: -2.5, duration: 0.5, ease: "back.out(1.8)" },
        CUES.basalon,
      );
      tl.fromTo(check, { strokeDashoffset: 1.21 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, CUES.basalon + 0.18);

      tl.fromTo(
        chipNo,
        { opacity: 0, scale: 0.5, y: 26, rotation: 8 },
        { opacity: 1, scale: 1, y: 0, rotation: 2, duration: 0.45, ease: "back.out(1.8)" },
        CUES.mulHasapak,
      );
      tl.fromTo(strikeBar, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, CUES.mulHasapak + 0.2);
      tl.fromTo(noText, { color: "#1F2C4A" }, { color: "#9A9A9A", duration: 0.3, ease: "power1.out" }, CUES.mulHasapak + 0.3);
      tl.fromTo(iconNo, { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, CUES.mulHasapak + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-cards"] = tl;
    })();
  </script>
