<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .footage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 0;
      }
      .scene { z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23"
      data-width="1080"
      data-height="1920"
    >
      <!-- footage:begin -->
      <video id="footage-1" class="clip footage" src="assets/clips/f2-open-box.mp4" muted playsinline data-start="5.0" data-duration="4.5" data-track-index="3"></video>
      <!-- footage:end -->
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-reveal"
        class="scene"
        data-composition-id="02-reveal"
        data-composition-src="compositions/frames/02-reveal.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-cards"
        class="scene"
        data-composition-id="03-cards"
        data-composition-src="compositions/frames/03-cards.html"
        data-start="9.5"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-bonus"
        class="scene"
        data-composition-id="04-bonus"
        data-composition-src="compositions/frames/04-bonus.html"
        data-start="15.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="19.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-reveal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.fromTo("#el-03-cards", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.to("#el-03-cards", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 15.5);
        tl.fromTo("#el-04-bonus", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 15.5);
        tl.to("#el-04-bonus", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.to({}, { duration: 23 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
